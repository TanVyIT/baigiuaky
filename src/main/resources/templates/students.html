<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh sách sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background: #f4f7fb; }
        .student-card { border: 0; border-radius: 1rem; overflow: hidden; }
        .student-card .card-header { padding: 1rem 1.25rem; }
        .student-card .card-body { padding: 1.25rem; }
        .table th, .table td { vertical-align: middle; }
    </style>
</head>

<body>
<div class="container py-4 py-lg-5">
    <div class="card student-card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h1 class="h3 mb-0">Danh sách sinh viên</h1>
        </div>

        <div class="card-body">
            <div th:if="${message}" class="alert alert-success" role="alert"
                 th:text="${message}"></div>

            <div class="d-flex flex-column flex-lg-row align-items-stretch gap-3 mb-4">
                <form th:action="@{/students}" method="get"
                      class="row g-2 flex-grow-1">
                    <div class="col">
                        <label for="student-search" class="visually-hidden">
                            Tìm theo tên sinh viên
                        </label>
                        <input id="student-search"
                               type="search"
                               name="keyword"
                               th:value="${keyword}"
                               class="form-control"
                               placeholder="Nhập tên sinh viên...">
                    </div>

                    <div class="col-auto">
                        <button class="btn btn-primary" type="submit">
                            Tìm kiếm
                        </button>
                    </div>

                    <div class="col-auto">
                        <a th:href="@{/students}" class="btn btn-outline-secondary">
                            Làm mới
                        </a>
                    </div>
                </form>

                <a th:href="@{/students/new}"
                   class="btn btn-success text-nowrap">
                    + Thêm sinh viên
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Họ tên</th>
                        <th scope="col">Tuổi</th>
                        <th scope="col">Giới tính</th>
                        <th scope="col">Email</th>
                        <th scope="col">Thao tác</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="student : ${students}">
                        <td th:text="${student.id}"></td>
                        <td th:text="${student.name}"></td>
                        <td th:text="${student.age}"></td>
                        <td th:text="${student.gender}"></td>
                        <td th:text="${student.email}"></td>
                        <td class="text-nowrap">
                            <div class="d-flex flex-wrap gap-1">
                                <a th:href="@{/students/{id}(id=${student.id})}"
                                   class="btn btn-info btn-sm">
                                    Chi tiết
                                </a>
                                <a th:href="@{/students/{id}/edit(id=${student.id})}"
                                   class="btn btn-warning btn-sm">
                                    Sửa
                                </a>
                                <form th:action="@{/students/{id}/delete(id=${student.id})}"
                                      method="post"
                                      class="d-inline"
                                      onsubmit="return confirm('Bạn có chắc muốn xóa sinh viên này?')">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        Xóa
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            Không tìm thấy sinh viên
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
