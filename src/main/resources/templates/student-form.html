<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${student.id == 0 ? 'Thêm sinh viên' : 'Sửa sinh viên'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0" th:text="${student.id == 0 ? 'Thêm sinh viên' : 'Sửa sinh viên'}"></h3>
        </div>
        <div class="card-body">
            <form th:action="@{/students/save}" th:object="${student}" method="post">
                <div class="mb-3">
                    <label class="form-label">ID</label>
                    <input th:field="*{id}" type="number" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Họ tên</label>
                    <input th:field="*{name}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tuổi</label>
                    <input th:field="*{age}" type="number" min="1" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Giới tính</label>
                    <input th:field="*{gender}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input th:field="*{email}" type="email" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Lưu</button>
                <a th:href="@{/students}" class="btn btn-secondary">Hủy</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
