<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Chi tiết sinh viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Thông tin sinh viên</h3>
        </div>

        <div class="card-body">
            <p>
                <strong>ID:</strong>
                <span th:text="${student.id}"></span>
            </p>

            <p>
                <strong>Họ tên:</strong>
                <span th:text="${student.name}"></span>
            </p>

            <p>
                <strong>Tuổi:</strong>
                <span th:text="${student.age}"></span>
            </p>

            <p>
                <strong>Giới tính:</strong>
                <span th:text="${student.gender}"></span>
            </p>

            <p>
                <strong>Email:</strong>
                <span th:text="${student.email}"></span>
            </p>

            <a th:href="@{/students}" class="btn btn-secondary">
                Quay lại
            </a>
            <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-warning">Sửa</a>
            <form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger"
                        onclick="return confirm('Bạn có chắc muốn xóa sinh viên này?')">Xóa</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
